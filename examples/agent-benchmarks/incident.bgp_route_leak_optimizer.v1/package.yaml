scenario:
  id: incident.bgp_route_leak_optimizer.v1
  title: BGP Route Leak Via Optimizer
  family: incident
  version: 1
  status: mission_ready
  owner: seed-agent-benchmark

files:
  case: case.md
  topology: topology.yaml
  normal_state: normal_state.yaml
  fault_injection: fault_injection.yaml
  agent_policy: agent_policy.yaml
  oracle: oracle.json
  scorer: scorer.py
  runbook: runbook.md
  codex_task: codex_task.md
  evidence_schema: evidence_schema.json
  mission_task: ../../agent-missions/tasks/TS_B00_ROUTE_LEAK_OPTIMIZER_LIVE.yaml
  mission_playbook: ../../agent-missions/playbooks/ts_b00_route_leak_optimizer_live.yaml
  replay_dir: replay

stages:
  - baseline
  - inject
  - observe
  - propose
  - gate
  - act
  - verify
  - score

first_runtime_target:
  base_example: examples/internet/B00_mini_internet
  compose_project_name: agent_bgp_leak
  target_prefix: 10.150.0.0/24
  victim_asn: 150
  leaking_asn: 151
  transit_asn: 2

compatibility:
  existing_agent_mission_reference: examples/agent-missions/tasks/TS_B00_PREFIX_HIJACK_LIVE.yaml
  exported_agent_mission: examples/agent-missions/tasks/TS_B00_ROUTE_LEAK_OPTIMIZER_LIVE.yaml
  migration_rule: >
    benchmark package can emit a mission YAML, but mission YAML is not the
    source of truth

operator_contract:
  live_execution: supervised
  confirmation_token: YES_RUN_DYNAMIC_FAULTS
  default_policy_variant: perm.route_leak.O3A3
  rollback_required: true
  replay_output:
    default_dir: /tmp/seed-agent-benchmark/incident.bgp_route_leak_optimizer.v1
    semantic_result: semantic_replay.json
