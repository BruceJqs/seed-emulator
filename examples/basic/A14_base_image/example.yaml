id: basic-a14-base-image
name: Platform-aware Base Image
description: A host selects an explicit OCI base image through the Node image contract.
runner: generic
script: base_image.py
platform: amd
features:
  - explicit-base-image
  - platform-aware-image

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 300

build:
  enabled: true
  timeout: 1200

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: A14 host is running
      type: compose-ps
      services:
        - hnode_150_host
      retries: 30
      interval: 2

probes:
  - name: Explicit base-image host has an operating system
    type: exec
    service: hnode_150_host
    command: test -r /etc/os-release
    retries: 10
    interval: 2

test_programs:
  - name: A14 image contract and runtime validation
    script: test_runtime.py
    timeout: 300
