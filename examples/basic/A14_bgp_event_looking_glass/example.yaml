id: basic-a14-bgp-event-looking-glass
name: BGP Event Dashboard and Looking Glass
description: Separate ExaBGP event dashboard and BGP route-state Looking Glass observers.
runner: internet
script: bgp_event_looking_glass.py
platform: amd
features:
  - looking-glass
  - exabgp-service
  - bgp-control-plane
  - ipv4-default

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 300

build:
  enabled: true
  timeout: 1200

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: A14 observers and routers are running
      type: compose-ps
      services:
        - hnode_2_looking-glass
        - hnode_151_event-viewer
        - brdnode_2_router0
        - brdnode_151_router0
      retries: 30
      interval: 2

probes:
  - name: Looking Glass frontend responds
    type: http
    url: http://127.0.0.1:5002/
    expect_status: 200
    retries: 30
    interval: 5

  - name: ExaBGP event dashboard responds
    type: http
    url: http://127.0.0.1:5003/
    expect_status: 200
    retries: 30
    interval: 5

test_programs:
  - name: A14 generated observer config validation
    script: test_runtime.py
    timeout: 180
