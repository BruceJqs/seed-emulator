id: Z30
slug: Z30_b30_mini_internet_exabgp_ix
title: B30 Mini Internet ExaBGP IX Tool Discovery
source_examples:
  - family: B
    example_id: B30_mini_internet_exabgp_ix
    output_dir: examples/internet/B30_mini_internet_exabgp_ix/output
runtime_contract:
  stage: already_running_network
  planner_visibility: runtime_restricted
  full_container_access: true
  future_partial_visibility_ready: true
tool_contract:
  high_level:
    - seed_agent_run
    - seed_agent_plan
    - seed_agent_policy_check
    - seed_agent_task_begin
    - seed_agent_task_execute
    - seed_agent_task_status
  preferred_ops:
    - workspace_refresh
    - inventory_list_nodes
    - routing_protocol_summary
    - routing_looking_glass
    - ops_logs
    - ops_exec
    - job_get
    - job_steps_list
    - artifacts_list
    - artifact_read
  risky_ops: []
  shell_command_policy:
    default: read_only_evidence_collection
    allowed_only_for:
      - locating ExaBGP and IX route-server evidence
      - reading ExaBGP config, logs, process state, and listener state
      - read-only route-state inspection without announcements, withdrawals, or file edits
orchestration_contract:
  canonical_loop:
    - attach
    - inventory the B30 mini-internet IX runtime
    - locate ExaBGP and IX route-server nodes
    - collect peer, announcement, route-state, log, and listener evidence
    - summarize tool role and observability gaps without changing configuration
  primary_entry: seed_agent_run
  structured_task_entry:
    - TS_B30_EXABGP_IX_TOOL_DISCOVERY
  deterministic_fallback:
    - examples/agent-missions/playbooks/ts_b30_exabgp_ix_tool_discovery.yaml
skill_contract:
  task_skill_patterns:
    - attach-and-scan
    - control-plane-inspection
    - ix-route-server-inspection
    - evidence-collection
  why_it_fits:
    - B30 exposes ExaBGP as an IX-facing control-plane tool in a mini-internet setting.
    - The mission is intentionally read-only so agents learn evidence surfaces before any live routing changes.
command_contract:
  interactive_ui: ./scripts/seed-codex ui -m gpt-5.4 -c 'model_reasoning_effort="low"'
  read_only_probe: ./scripts/seed-codex run "Attach to examples/internet/B30_mini_internet_exabgp_ix/output; locate the ExaBGP IX tool surfaces, summarize peers, route-server evidence, logs, listeners, and current announcements without making configuration changes." --workspace-name z30_probe --attach-output-dir examples/internet/B30_mini_internet_exabgp_ix/output --policy read_only
  mission_examples:
    - ./scripts/seed-codex mission start --task TS_B30_EXABGP_IX_TOOL_DISCOVERY --objective "Discover ExaBGP IX tool evidence surfaces without changing configuration" --attach-output-dir examples/internet/B30_mini_internet_exabgp_ix/output
status:
  live_readiness: conditional_go
  best_for:
    - ExaBGP IX tool discovery
    - route-server evidence collection
    - read-only BGP observability rehearsals
  hard_boundaries:
    - Do not edit ExaBGP, BIRD, FRR, Docker, or compose configuration.
    - Do not announce, withdraw, flap, restart, or inject routes.
    - Treat shell access as read-only evidence collection only.
